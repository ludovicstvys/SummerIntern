{% extends "base.html" %}{% block content %}<section class="narrow"><div class="eyebrow">Administration</div><h1>People and access.</h1><form class="invite" action="/admin/invite" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="email" name="email" required placeholder="person@example.com"><button class="primary">Invite person</button></form><div class="people">{% for person in users %}<article><div><strong>{{ person.email }}</strong><p>{{ person.role|title }} · {{ 'Active' if person.is_active else 'Disabled' }}</p></div>{% if person.id != user.id %}<form action="/admin/users/{{ person.id }}/toggle" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="secondary">{{ 'Disable' if person.is_active else 'Enable' }}</button></form>{% endif %}</article>{% endfor %}</div></section>{% endblock %}
