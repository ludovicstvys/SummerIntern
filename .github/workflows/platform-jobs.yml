name: Trackr platform jobs
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
concurrency:
  group: trackr-platform-jobs
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      ENVIRONMENT: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      APP_URL: https://trackr-alerts.vercel.app
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL || secrets.SMTP_USER }}
      SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_FROM: ${{ secrets.SMTP_FROM || secrets.SMTP_USER }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS_APP: ${{ secrets.SMTP_PASS_APP }}
      NOTION_CLIENT_ID: ${{ secrets.NOTION_CLIENT_ID }}
      NOTION_CLIENT_SECRET: ${{ secrets.NOTION_CLIENT_SECRET }}
      NOTION_VERSION: "2025-09-03"
      TRACKR_SEASON: "2027"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Collect and process every queue
        run: |
          failed=0
          python -m trackr_app.cli scrape-all || failed=1
          python -m trackr_app.cli process-immediate-alerts || failed=1
          python -m trackr_app.cli process-digests || failed=1
          python -m trackr_app.cli sync-notion || failed=1
          exit "$failed"
