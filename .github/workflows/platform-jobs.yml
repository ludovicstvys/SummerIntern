name: Trackr platform jobs
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
concurrency:
  group: trackr-production-state
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      ENVIRONMENT: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      APP_URL: https://trackr-alerts.vercel.app
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL || secrets.SMTP_USER }}
      SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_FROM: ${{ secrets.SMTP_FROM || secrets.SMTP_USER }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS_APP: ${{ secrets.SMTP_PASS_APP }}
      NOTION_CLIENT_ID: ${{ secrets.NOTION_CLIENT_ID }}
      NOTION_CLIENT_SECRET: ${{ secrets.NOTION_CLIENT_SECRET }}
      NOTION_VERSION: "2025-09-03"
      TRACKR_SEASON: "2027"
      NOTION_SYNC_ENABLED: ${{ vars.NOTION_SYNC_ENABLED || 'false' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Collect offers
        id: scrape
        continue-on-error: true
        run: timeout 210s python -m trackr_app.cli scrape-all
      - name: Send invitations
        id: invitations
        continue-on-error: true
        run: timeout 150s python -m trackr_app.cli process-invitations
      - name: Send immediate alerts
        id: immediate
        continue-on-error: true
        run: timeout 150s python -m trackr_app.cli process-immediate-alerts
      - name: Send daily digests
        id: digests
        continue-on-error: true
        run: timeout 150s python -m trackr_app.cli process-digests
      - name: Sync personal Notion databases when enabled
        id: notion
        continue-on-error: true
        run: timeout 180s python -m trackr_app.cli sync-notion
      - name: Check freshness and queues
        id: operations
        continue-on-error: true
        run: python -m trackr_app.cli check-operations
      - name: Report processing failure
        if: steps.scrape.outcome == 'failure' || steps.invitations.outcome == 'failure' || steps.immediate.outcome == 'failure' || steps.digests.outcome == 'failure' || steps.notion.outcome == 'failure' || steps.operations.outcome == 'failure'
        run: exit 1
