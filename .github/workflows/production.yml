name: Test, migrate and deploy production
on:
  push:
    branches: [main]
    paths-ignore: ["processus_ouverts*.csv"]
  workflow_dispatch:
concurrency:
  group: trackr-deployment
  queue: max
  cancel-in-progress: false
permissions:
  contents: read
  actions: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: trackr
          POSTGRES_PASSWORD: trackr
          POSTGRES_DB: trackr_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trackr -d trackr_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PYTHON_DOTENV_DISABLED: "1"
      DATABASE_URL: sqlite://
      TEST_DATABASE_URL: postgresql+psycopg://trackr:trackr@localhost:5432/trackr_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip_audit -r requirements.lock --no-deps --disable-pip
      - run: python -m pip check
      - run: python -m compileall -q trackr_app api scripts
      - run: python -m pytest -q
  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      ALLOW_DEPLOYMENT_HOST: 'true'
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN || secrets.VERCEL_BOOTSTRAP_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      NOTION_SYNC_ENABLED: ${{ vars.NOTION_SYNC_ENABLED || 'false' }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      APP_URL: ${{ vars.APP_URL || 'https://trackr-alerts.vercel.app' }}
      ALLOWED_HOSTS: ${{ vars.ALLOWED_HOSTS }}
      AUTH_ALLOWED_ORIGINS: ${{ vars.AUTH_ALLOWED_ORIGINS }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL || secrets.SMTP_USER }}
      SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS_APP: ${{ secrets.SMTP_PASS_APP }}
      SMTP_FROM: ${{ secrets.SMTP_FROM || secrets.SMTP_USER }}
      NOTION_CLIENT_ID: ${{ secrets.NOTION_CLIENT_ID }}
      NOTION_CLIENT_SECRET: ${{ secrets.NOTION_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - run: python -m pip install -r requirements.txt
      - run: npm install --global vercel@59.11.7
      - name: Verify credentials
        run: test -n "$VERCEL_TOKEN"
      - name: Validate application configuration
        env:
          ENVIRONMENT: production
          APP_URL: ${{ vars.APP_URL || 'https://trackr-alerts.vercel.app' }}
        run: python -c "from trackr_app.config import settings; settings.validate()"
      - name: Synchronize web configuration
        run: python scripts/configure_vercel.py
      - name: Deploy remote-built candidate, migrate, promote and verify rollback on failure
        run: python scripts/release.py
      - name: Restore worker schedules after runner failure
        if: always()
        run: python scripts/worker_schedules.py resume
