name: Legacy CSV and Notion scrape
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
concurrency:
  group: trackr-production-state
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHON_DOTENV_DISABLED: "1"
      LEGACY_EMAIL_ENABLED: ${{ vars.LEGACY_EMAIL_ENABLED || 'true' }}
      LEGACY_TODO_ENABLED: ${{ vars.LEGACY_TODO_ENABLED || 'false' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run all legacy collectors independently
        id: collectors
        continue-on-error: true
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          TODO_DATA_SOURCE_ID: ${{ secrets.TODO_DATA_SOURCE_ID }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS_APP: ${{ secrets.SMTP_PASS_APP }}
          FROM_ADDR: ${{ secrets.SMTP_USER }}
          TO_ADDRS: ${{ secrets.TO_ADDRS }}
        run: |
          failed=0
          for script in test.py scrape_off_cycle_fr.py scrape_summer_fr.py scrape_off_cycle_uk.py scrape_summer_hk.py scrape_off_cycle_hk.py; do
            timeout 150s python "$script" || failed=1
          done
          exit "$failed"
      - name: Commit valid CSV updates
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add processus_ouverts.csv processus_ouverts_fr_off_cycle.csv processus_ouverts_fr_summer.csv processus_ouverts_uk_off_cycle.csv processus_ouverts_hk_summer.csv processus_ouverts_hk_off_cycle.csv
          if ! git diff --cached --quiet; then
            git commit -m "Mise à jour des CSV internships"
            git push
          fi
      - name: Report partial collector failure
        if: steps.collectors.outcome == 'failure'
        run: exit 1
