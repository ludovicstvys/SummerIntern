name: Legacy CSV and Notion scrape
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
concurrency:
  group: trackr-legacy
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      ENVIRONMENT: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHON_DOTENV_DISABLED: "1"
      LEGACY_EMAIL_ENABLED: ${{ vars.LEGACY_EMAIL_ENABLED || 'false' }}
      LEGACY_TODO_ENABLED: ${{ vars.LEGACY_TODO_ENABLED || 'false' }}
      LEGACY_NOTION_ENABLED: ${{ vars.LEGACY_NOTION_ENABLED || 'true' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run all legacy collectors independently
        id: collectors
        continue-on-error: true
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          TODO_DATA_SOURCE_ID: ${{ secrets.TODO_DATA_SOURCE_ID }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS_APP: ${{ secrets.SMTP_PASS_APP }}
          FROM_ADDR: ${{ secrets.SMTP_USER }}
          TO_ADDRS: ${{ secrets.TO_ADDRS }}
        run: |
          failed=0
          for script in test.py scrape_off_cycle_fr.py scrape_summer_fr.py scrape_off_cycle_uk.py scrape_summer_hk.py scrape_off_cycle_hk.py; do
            timeout 100s python "$script" || failed=1
          done
          exit "$failed"
      - name: Report partial collector failure
        if: steps.collectors.outcome == 'failure'
        run: exit 1
