name: Trackr email delivery
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
concurrency:
  group: trackr-deliveries
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      ENVIRONMENT: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      APP_URL: ${{ vars.APP_URL || 'https://trackr-alerts.vercel.app' }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
      SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_FROM: ${{ secrets.SMTP_FROM || secrets.SMTP_USER }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS_APP: ${{ secrets.SMTP_PASS_APP }}
      TRACKR_SEASON: "2027"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Deliver authentication links and password resets
        id: auth
        continue-on-error: true
        run: timeout 100s python -m trackr_app.cli process-auth-mail
      - name: Deliver invitations
        id: invitations
        continue-on-error: true
        run: timeout 100s python -m trackr_app.cli process-invitations
      - name: Send immediate alerts
        id: immediate
        continue-on-error: true
        run: timeout 150s python -m trackr_app.cli process-immediate-alerts
      - name: Send daily digests
        id: digests
        continue-on-error: true
        run: timeout 150s python -m trackr_app.cli process-digests
      - name: Report processing failure
        if: steps.auth.outcome == 'failure' || steps.invitations.outcome == 'failure' || steps.immediate.outcome == 'failure' || steps.digests.outcome == 'failure'
        run: exit 1
